<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Maintenance — Jérôme Marlier</title>
  <meta name="robots" content="noindex,nofollow" />
  <style>
    :root{ --bg:#0A0A0B; --text:#FFFFFF; --muted:#A1A1AA; --primary:#3B82F6; --accent:#10B981; }
    *{ box-sizing:border-box }
    html,body{ height:100% }
    body{ margin:0; display:grid; place-items:center; background:var(--bg); color:var(--text); font:16px/1.6 Inter, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, sans-serif }
    .card{ text-align:center; padding:2rem 1.5rem; border:1px solid #333; border-radius:12px; width:min(560px,92vw); background:#111213; box-shadow: 0 8px 24px rgba(0,0,0,.35) }
    .logo{ display:inline-flex; align-items:center; gap:.75rem; margin-bottom: .75rem }
    .logo img{ width:40px; height:40px; border-radius:8px; display:block }
    h1{ margin:.25rem 0 .5rem; font-size:1.5rem; color:var(--primary) }
    p{ margin:.25rem 0; color:var(--muted) }
    .hint{ margin-top:1rem; font-size:.95rem }
    .btn{ display:inline-block; margin-top:1rem; padding:.6rem 1rem; border-radius:8px; border:2px solid var(--accent); color:var(--accent); background:transparent; text-decoration:none }
    .btn:hover{ background:var(--accent); color:#0A0A0B }
  </style>
  <link rel="icon" href="/favicon.ico" />
</head>
<body>
  <main class="card" role="main">
    <div class="logo">
      <img src="/img/logo-monogram.svg" alt="Logo monogramme JM" />
      <strong>Jérôme Marlier</strong>
    </div>
    <h1>Nous revenons très vite</h1>
    <p>Le site est momentanément en maintenance pour une mise à jour.</p>
    <p class="hint">Merci de réessayer un peu plus tard.</p>
  </main>
</body>
</html>
