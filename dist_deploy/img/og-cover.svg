<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0A0B"/>
      <stop offset="100%" stop-color="#111213"/>
    </linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Accent glow -->
  <circle cx="980" cy="-40" r="260" fill="#FBBF24" opacity="0.25" filter="url(#glow)"/>

  <!-- Monogram -->
  <g transform="translate(120,140)">
    <path d="M0 0 L0 240" stroke="url(#g)" stroke-width="18" stroke-linecap="round"/>
    <path d="M48 56 L144 168 L240 56" stroke="#10B981" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M300 0 L300 240" stroke="#FBBF24" stroke-width="18" stroke-linecap="round"/>
  </g>

  <!-- Text -->
  <g font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, sans-serif" fill="#FFFFFF">
    <text x="120" y="390" font-size="64" font-weight="700">Jérôme Marlier</text>
    <text x="120" y="450" font-size="36" fill="#A1A1AA">Développeur Web Freelance</text>
    <text x="120" y="508" font-size="28" fill="#8B5CF6">Sites vitrines, Back‑office, Apps métier</text>
  </g>

  <title>Open Graph Cover — Jérôme Marlier</title>
</svg>

